[package]
name = "skylines"
version = "0.1.0"
description = "Skylines - a local-first note-taking app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skylines_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-screenshots = "2"

# `devtools` is intentionally Android-only: it's needed to attach a CDP
# inspector to a release-profile Android build (release profiles strip the
# `debug_assertions`-gated auto-enable that Tauri normally relies on), but it
# must not leak into the already-shipped Windows desktop build, where it
# would expose the JS/IPC context of a notes app to anyone with local access.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }


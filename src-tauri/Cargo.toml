[package]
name = "skylines"
version = "0.1.0"
description = "Skylines - a local-first note-taking app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skylines_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-screenshots = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-mcp-bridge = "=0.13.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
url = "2"

# `devtools` is Android-only: it lets an inspector attach to release Android
# builds, but on desktop it would expose the app's JS/IPC context to anyone
# with local access.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }

# Sets sticky note windows' AppUserModelID so they get their own taskbar group.
# Same major version as Tauri's, so HWND types line up.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
